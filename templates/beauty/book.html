{% extends 'base.html' %}{% block content %}
<main class="page form-page">
    <p class="eyebrow">RÉSERVATION</p>
    <h1>Réserver chez 
        <i>{{ institute.name }}</i>
    </h1>
    <p class="lead">Choisissez votre service et le créneau qui vous convient.</p>
    <form method="post" class="form-card">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}
        <label>{{ field.label }}{{ field }}{% for error in field.errors %}
            <small class="error">{{ error }}</small>{% endfor %}
        </label>{% endfor %}<button class="btn gold">Confirmer ma demande →</button>
    </form>
</main>{% endblock %}
